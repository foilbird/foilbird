# SPDX-License-Identifier: Apache-2.0
# k8s-worker profile: the Debian 13 node image plus containerd, runc, kubelet/kubeadm, CNI plugins and the
# NVIDIA container toolkit (CDI). One image = one SBOM; the profile is chosen at install time, never changed on a node.
# Build: from this directory, `mkosi --include=../../images/debian/mkosi/pinned.conf build` (README, Build): pinned.conf from
# images/debian/tools/apt-pin.py prepare with the base image's and this profile's apt-pin.conf (verified local copies of the
# APT repositories, only at build time), upstream/ from tools/fetch-upstream.py prepare (containerd, runc).
[Include]
Include=../../images/debian/mkosi

# ImageId/ImageVersion come from the base (sysupdate patterns are built on them); the release number is passed with
# --image-version at build time. The profile name is FOILBIRD_PROFILE= in os-release (mkosi.finalize).

[Build]
# the base image's build script reads its inputs (nvsrc/, keys, t9/, tools/) from /work/src, this profile's from
# /work/src/k8s-worker
BuildSources=../../images/debian/mkosi
             .:k8s-worker
             # T5 gate of mkosi.finalize ($SRCDIR/image-tools/t5-check)
             ../../images/debian/tools:image-tools

[Content]
# no shell on the node (T5): nothing to log in to
Autologin=no
# No console login. The getty generator starts nothing (no serial-getty@ on the console= tty), the getty units are
# masked below (mkosi.extra: symlinks to /dev/null) and the login tools are removed; the kernel and systemd still write
# to the console. Appended to the base image's command line.
KernelCommandLine=systemd.getty_auto=0
Packages=
        ca-certificates
        e2fsprogs
        systemd-repart
        systemd-resolved
        systemd-timesyncd
        # kubelet (iptables, kubernetes-cni), kubeadm (cri-tools), nvidia-container-toolkit-base (gpu variant only): pinned in apt-pin.conf
BuildPackages=
        golang-go
RemoveFiles=
        # T5: no shell on the host. Package maintainer scripts have already run at build time.
        /usr/bin/sh
        /usr/bin/dash
        /usr/bin/bash
        /usr/bin/rbash
        /usr/bin/bashbug
        /usr/share/debianutils/shells.d/bash
        /usr/share/debianutils/shells.d/dash
        /usr/share/lintian/overrides/bash
        /usr/share/lintian/overrides/dash
        # klibc-utils (its sh and the other klibc tools) and libklibc: initramfs-tools-core needs them to build an
        # initramfs-tools initrd, pulled only because linux-image depends on initramfs-tools; the image boots mkosi's UKI
        # initrd, so on the host they are dead weight and klibc's sh is a shell (T5)
        /usr/lib/klibc
        /usr/lib/klibc-*.so
        /usr/share/doc/klibc-utils
        /usr/share/doc/libklibc
        /usr/share/lintian/overrides/klibc-utils
        /usr/share/lintian/overrides/libklibc
        /usr/share/menu/bash
        /usr/share/menu/dash
        # T5: no interpreter on the host. mawk is the only one left after perl-base (RemovePackages= of the base) and the
        # shells: nothing at runtime calls awk (units, udev rules, tmpfiles, kubelet/kubeadm/containerd/runc binaries; only
        # dead shell scripts of the essential packages do). The alternatives links go too, or tmpfiles (foil-etc-factory.conf)
        # would recreate dangling /etc/alternatives/{awk,nawk} on the node; the examples are executable mawk scripts.
        /usr/bin/mawk
        /usr/bin/awk
        /usr/bin/nawk
        /etc/alternatives/awk
        /etc/alternatives/awk.1.gz
        /etc/alternatives/nawk
        /etc/alternatives/nawk.1.gz
        /usr/share/doc/mawk
        /usr/share/man/man1/mawk.1.gz
        /usr/share/man/man1/awk.1.gz
        /usr/share/man/man1/nawk.1.gz
        /usr/share/lintian/overrides/mawk
        # e2fsprogs' e2scrub units are bash scripts (fail without a shell); /var is checked by fsck at mount instead
        /usr/lib/systemd/system/e2scrub_all.service
        /usr/lib/systemd/system/e2scrub_all.timer
        /usr/lib/systemd/system/e2scrub_reap.service
        /usr/lib/systemd/system/e2scrub@.service
        /usr/lib/systemd/system/e2scrub_fail@.service
        /usr/sbin/e2scrub
        /usr/sbin/e2scrub_all
        # Nothing to log in with. getty (util-linux: agetty, getty), su/sulogin/runuser and systemd's sulogin wrapper
        # (emergency and rescue reboot instead, base image drop-ins), the passwd tools (no local accounts are managed on
        # the node; sysusers creates the system users) and their PAM stacks, the getty.target link of multi-user.target
        /usr/sbin/agetty
        /usr/sbin/getty
        /usr/bin/su
        /usr/sbin/sulogin
        /usr/sbin/runuser
        /usr/lib/systemd/systemd-sulogin-shell
        /usr/bin/passwd
        /usr/bin/chsh
        /usr/bin/chfn
        /usr/bin/gpasswd
        /usr/bin/chage
        /usr/bin/expiry
        /usr/bin/newgrp
        /usr/bin/sg
        /usr/sbin/chpasswd
        /usr/sbin/chgpasswd
        /usr/sbin/newusers
        /usr/sbin/vipw
        /usr/sbin/vigr
        /usr/sbin/pwconv
        /usr/sbin/pwunconv
        /usr/sbin/grpconv
        /usr/sbin/grpunconv
        /etc/pam.d/su
        /etc/pam.d/su-l
        /etc/pam.d/runuser
        /etc/pam.d/runuser-l
        /etc/pam.d/passwd
        /etc/pam.d/chsh
        /etc/pam.d/chfn
        /etc/pam.d/chpasswd
        /etc/pam.d/newusers
        /etc/pam.d/login
        /etc/pam.d/sulogin
        /etc/securetty
        /usr/lib/systemd/system/multi-user.target.wants/getty.target
        /usr/lib/systemd/system/getty.target.wants
        /usr/lib/systemd/system-generators/systemd-getty-generator
