# SPDX-License-Identifier: Apache-2.0
# Third-party apt sets of the k8s-worker profile, on top of the base image's (../../images/debian/apt-pin.conf).
# images/debian/tools/apt-pin.py; lock: apt-pin.lock next to this file (also holds the release files of
# tools/fetch-upstream.py). The trust anchor of each repository is pinned in apt-pin.py (TRUSTED), never here.

# kubelet = TEST control plane; kubernetes-cni: CNI plugins, moved from /opt to /usr/lib/cni by mkosi.finalize
[k8s]
repo     = https://pkgs.k8s.io/core:/stable:/v1.34/deb
packages = kubelet=1.34.3-1.1 kubeadm=1.34.3-1.1 cri-tools=1.34.0-1.1 kubernetes-cni=1.7.1-1.1
license  = Apache-2.0

# CDI hook and nvidia-ctk only (no libnvidia-container userspace on the host)
[nvidia-container-toolkit]
repo     = https://nvidia.github.io/libnvidia-container/stable/deb/amd64
packages = nvidia-container-toolkit-base=1.20.2-1
license  = Apache-2.0
