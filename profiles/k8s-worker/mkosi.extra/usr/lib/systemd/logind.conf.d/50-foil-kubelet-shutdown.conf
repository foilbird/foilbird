# Graceful node shutdown: logind waits up to this long for the kubelet's delay inhibitor before a
# reboot or power-off, so the kubelet can stop the pods in order (regular pods, then critical ones) instead of
# systemd sending SIGTERM to every container scope at once and waiting DefaultTimeoutStopSec (90 s) for each.
# Must be >= the kubelet's shutdownGracePeriod (60 s, set by the cluster's KubeletConfiguration, see the profile
# README). The kubelet writes its own drop-in into /etc only after it starts, and /etc is a tmpfs; this one is in
# the signed /usr and is in force from the first boot on.
[Login]
InhibitDelayMaxSec=60
