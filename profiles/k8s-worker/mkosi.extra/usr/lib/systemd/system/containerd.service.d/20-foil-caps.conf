# T9: no container may load kernel modules or reboot the host, privileged or not. The bounding set of
# containerd is inherited by the shims, runc and every container, so a capability removed here cannot be granted to a
# pod by securityContext (privileged: true included). Kernel modules come only from the signed image (/usr), loaded by
# the host (udev, modules-load.d, nvidia-modprobe of foil-nvidia-cdi on a GPU image); reboots only through the node agent.
[Service]
CapabilityBoundingSet=~CAP_SYS_MODULE CAP_SYS_BOOT
