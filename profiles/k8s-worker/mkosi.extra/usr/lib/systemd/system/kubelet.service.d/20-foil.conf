# k8s-worker: labels/taints from the node configuration (foil-k8s-env), state on the persistent /var only.
[Unit]
Requires=foil-k8s-env.service containerd.service
After=foil-k8s-env.service containerd.service var-lib-kubelet.mount
RequiresMountsFor=/var/lib/kubelet
# Until kubeadm init/join writes its configuration the kubelet can only crash-loop (Restart= every 10 s), which shows up
# as 'Failed with result' on every boot before the node is configured. kubeadm restarts the kubelet after writing
# config.yaml, so the condition is met from then on, also on later boots (the file lives on the persistent /var).
ConditionPathExists=/var/lib/kubelet/config.yaml

[Service]
EnvironmentFile=-/run/foilbird/kubelet.env
