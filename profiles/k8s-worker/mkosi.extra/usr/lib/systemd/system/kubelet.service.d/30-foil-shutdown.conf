# Keep the kubelet alive 5 s after it is asked to stop, before systemd sends it SIGTERM.
# At a node shutdown the kubelet releases its logind inhibitor when its last pod group's timer expires; systemd then stops
# it at once, and its exit cancels the in-flight CRI StopContainer of a pod that ignores SIGTERM ~0.7 s before
# containerd's timer of the same length would send SIGKILL (kubernetes/kubernetes#110755). With the delay containerd
# kills the container itself and the container scope stops without a systemd timeout.
[Service]
ExecStop=/usr/bin/sleep 5
