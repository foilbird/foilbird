# Container scopes (cri-containerd-<id>.scope, systemd cgroup driver): at shutdown systemd stops whatever the kubelet's
# graceful node shutdown left running, so the grace the pods get is the kubelet's (shutdownGracePeriod, 60 s), not
# DefaultTimeoutStopSec (90 s) on top of it. A pod that ignores SIGTERM outlives the kubelet: the kubelet's per-priority
# group timer cancels its own StopContainer call just before containerd's timer of the same length would send SIGKILL,
# and the kubelet then releases its logind inhibitor (measured: 130.9 s from the request to the reboot).
# Prefix drop-in: applies to every cri-containerd-*.scope, transient ones included.
[Scope]
TimeoutStopSec=5s
