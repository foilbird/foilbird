# The persistent paths on /var; everything else there is not relied upon.
d  /var/lib/kubelet                         0700 root root -
d  /var/lib/containerd                      0711 root root -
# control plane v0: stacked etcd (kubeadm static pod) on the persistent /var; a separate volume is v1
d  /var/lib/etcd                            0700 root root -
d  /var/log/journal                         2755 root systemd-journal -
# /etc is tmpfs: kubeadm's /etc/kubernetes is kept with kubelet's state (same identity after reboot)
d  /var/lib/kubelet/etc-kubernetes          0755 root root -
d  /var/lib/kubelet/etc-kubernetes/manifests 0755 root root -
L  /etc/kubernetes                          -    -    -    - /var/lib/kubelet/etc-kubernetes
# clusters set up by kubespray point kubelet's clientCAFile at /etc/kubernetes/ssl/ca.crt; kubeadm writes pki/ca.crt
L  /var/lib/kubelet/etc-kubernetes/ssl      -    -    -    - pki
L  /etc/resolv.conf                         -    -    -    - /run/systemd/resolve/stub-resolv.conf
d  /var/run/cdi                             0755 root root -
# T6: /var/tmp does not survive a reboot (boot-time removal of its contents)
D! /var/tmp                                 1777 root root -
