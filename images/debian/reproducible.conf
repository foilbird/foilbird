# SPDX-License-Identifier: Apache-2.0
# Reproducible build inputs shared by the node image (mkosi/), the slot initrd (foilbird-initrd/) and the recovery UKI
# (recovery/), included by each of them (docs/reproducible-build.md).
#
# Snapshot=: every Debian package of the image AND of the tools tree comes from one snapshot.debian.org timestamp
# (mkosi 26: archive/debian/<ts> and archive/debian-security/<ts>). The tools tree does NOT inherit it (mkosi 26 copies
# only the ToolsTree* settings to it): tools-tree/mkosi.conf sets the same timestamp, read through the mkosi.tools.conf
# symlink of every build directory. apt checks InRelease against the Debian archive keys as for a live mirror; mkosi passes
# Acquire::Check-Valid-Until=false, as a snapshot's Valid-Until is in the past. mkosi 26 adds no <release>-updates
# suite with a snapshot: mkosi.sandbox/etc/apt/sources.list.d/debian-updates.sources adds it from the same timestamp.
# Change the timestamp only with tools/snapshot set <ts> (it rewrites all three); every build runs tools/snapshot check.
#
# ToolsTree=: the build tools (systemd-repart, ukify, mkfs.erofs, sbsign, apt, …) come from a Debian 13 tree built by
# mkosi from the same snapshot, not from the build host: a Debian build host and an Ubuntu CI runner use the same tools.
# Without ToolsTreeRelease mkosi takes Debian "testing".

[Config]
# Snapshot= for Debian: mkosi 26 (tag v26, 84af20892b61c8e177e391f997ded8b4cb5514f2)
MinimumVersion=26

[Distribution]
Snapshot=20261120T000000Z

[Build]
ToolsTree=default
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
# for the finalize scripts, which run in the tools tree (gpg: release keyring check; python3: image-sbom.py, t5-check)
ToolsTreePackages=
        gnupg
        python3
