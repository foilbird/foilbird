# SPDX-License-Identifier: Apache-2.0
# Configuration of mkosi's default tools tree (ToolsTree=default of reproducible.conf), read through the mkosi.tools.conf
# symlink in every build directory (foilbird-initrd, recovery, mkosi, profiles/k8s-worker; docs/reproducible-build.md).
#
# mkosi 26 does NOT pass Snapshot= on to the default tools tree: finalize_default_tools() copies only the multiversal
# and the ToolsTree* settings, and Snapshot= is universal ("tools=True" only allows it here). Without this file the tools
# tree came from the live http://deb.debian.org mirror (nearly every non-snapshot apt line of a build came from the
# tools tree). The same snapshot as the image; the <release>-updates source from the same sandbox tree
# (mkosi.sandbox -> ../mkosi/mkosi.sandbox), since mkosi adds no updates suite with a snapshot.
# The timestamp is written by tools/snapshot set and checked by tools/snapshot check, with reproducible.conf.

[Distribution]
Snapshot=20261120T000000Z
