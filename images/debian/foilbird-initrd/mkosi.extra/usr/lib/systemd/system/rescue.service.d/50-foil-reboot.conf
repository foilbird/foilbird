# No emergency shell on the node: any boot failure (initrd or system) reboots, so systemd-boot spends one try of the
# entry and falls back after the last one (docs/boot-assessment.md). Without this a slot failing in the initrd hangs
# in emergency mode forever and is never abandoned.
[Unit]
SuccessAction=reboot-force
FailureAction=reboot-force

[Service]
Type=oneshot
ExecStartPre=
ExecStart=
ExecStart=/usr/bin/echo "foilbird: boot failed, emergency mode is disabled, rebooting in 10 s (spends one boot try)"
ExecStart=/usr/bin/sleep 10
StandardOutput=journal+console
StandardInput=null
