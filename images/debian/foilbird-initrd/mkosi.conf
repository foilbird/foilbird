# SPDX-License-Identifier: Apache-2.0
# The initrd of the slot UKIs, built from this config instead of mkosi's default initrd: only Debian 13
# packages of the same release as the image, an explicit package list, no shell and no interpreter (as on Talos).
# build.sh writes out/initrd.cpio.zst; the main image takes it with Initrds= (images/debian/mkosi/mkosi.conf.d/
# 40-initrd.conf), so a profile that includes the base (profiles/k8s-worker) boots the same initrd. The kernel modules
# are added by the main image as its own archive (KernelInitrdModules=), from the image's kernel.
# What runs here: udev, systemd-veritysetup for /usr (usrhash= on the UKI command line, gpt-auto), the PCR 11
# measurements (systemd-pcrphase, needs the TPM2 libraries), root=tmpfs, foil-machine-id, switch-root. /var is
# unlocked by the system, not here (docs/disk-encryption.md); the initrd runs no systemd-repart (the definitions live in
# /usr/lib/foilbird/repart.d, which it does not read).
[Include]
# Debian snapshot, tools tree, mkosi version (docs/reproducible-build.md)
Include=../reproducible.conf

[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=cpio
ImageId=foilbird-initrd
ImageVersion=1
Output=initrd
# mkosi's default for cpio; named so the main image's Initrds= path does not depend on it
CompressOutput=zstd
ManifestFormat=

[Content]
Bootable=no
# writes /etc/initrd-release -> /etc/os-release (= /usr/lib/os-release of base-files, plus IMAGE_ID/IMAGE_VERSION)
MakeInitrd=yes
CleanPackageMetadata=yes
Locale=C.UTF-8
WithDocs=no
Packages=
        systemd
        udev
        kmod
        # device-mapper udev rules: dm devices (the /usr verity device) get their symlinks and survive switch-root
        dmsetup
        # systemd-veritysetup and its generator (Debian ships them in systemd-cryptsetup), libcryptsetup
        systemd-cryptsetup
        # dlopen'ed by systemd for the PCR measurements and the TPM2 SRK setup
        libtss2-esys-3.0.2-0t64
        libtss2-mu-4.0.1-0t64
        libtss2-rc0t64
        libtss2-tcti-device0t64
BuildPackages=
        gcc
        libc6-dev
RemovePackages=
        dpkg
        perl-base
# Shells, interpreters and the scripts that need them are removed by ../tools/no-interpreters.finalize (it fails the
# build if one is left); here only what is not a script
RemoveFiles=
        /usr/lib/systemd/catalog
        /usr/lib/udev/hwdb.d
        /etc/udev/hwdb.d
        /var/cache
        /var/log
        # translations (Locale=C.UTF-8 keeps only the C locale) and data for tools the initrd does not have
        /usr/share/locale/*
        /usr/share/zsh
        /usr/share/lintian
        /usr/share/bug
        # No system or configuration extensions in the initrd either (docs/image-policy.md)
        /usr/lib/systemd/system/systemd-sysext.service
        /usr/lib/systemd/system/systemd-confext.service
        /usr/lib/systemd/system/systemd-sysext.socket
        /usr/lib/systemd/system/systemd-sysext@.service
        /usr/lib/systemd/system/sockets.target.wants/systemd-sysext.socket
        /usr/lib/systemd/system/sysinit.target.wants/systemd-sysext.service
        /usr/lib/systemd/system/sysinit.target.wants/systemd-confext.service
        /usr/bin/systemd-sysext
        /usr/bin/systemd-confext
        # starts a shell (removed anyway); systemd.debug_shell would need a command line other than the signed one
        /usr/lib/systemd/system/debug-shell.service
        # its only rule (ibmveth on POWER) runs /bin/sh
        /usr/lib/udev/rules.d/73-special-net-names.rules
# the dpkg database as a data file for scanners (T13), the same place as in the image (../mkosi/mkosi.postinst)
PostInstallationScripts=../tools/dpkg-stash.postinst
FinalizeScripts=../tools/no-interpreters.finalize

[Validation]
# The initrd is not signed itself: it is a section of the signed UKI, and PCR 11 covers it
