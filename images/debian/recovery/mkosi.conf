# Recovery UKI (decision 0003): independent of the A/B slots, the whole system in the UKI's initrd, so it boots when
# both slots are bad. Read-only: mounts the ESP read-only, diagnoses both slots (foil-recovery-diag), writes no
# partition. build.sh stages the UKI as out/EFI/Linux/foilbird-recovery.efi; the main image copies out/ onto the ESP
# (images/debian/mkosi/mkosi.conf.d/60-recovery.conf).
# Sorting in systemd-boot: entries with tries left first, then by IMAGE_ID; "foilbird-deb" < "foilbird-recovery", so the
# recovery comes after the slots and before entries with no tries left (+0-N). It has no counter: it never loops away.
[Include]
# Debian snapshot, tools tree, mkosi version (docs/reproducible-build.md)
Include=../reproducible.conf

[Distribution]
Distribution=debian
Release=trixie

[Output]
Format=uki
ImageId=foilbird-recovery
ImageVersion=1
Output=foilbird-recovery

[Content]
Bootable=yes
# the UKI itself is the boot entry (the ESP already has systemd-boot from the slots image)
Bootloader=uki
# no root=: the system runs from the initrd. No gpt-auto (it would mount the ESP rw), no getty (no shell to log in to)
# console=tty0 console=ttyS0: kernel and systemd messages on the screen too; the LAST console= is the
# primary one (/dev/console), so the serial console stays primary. No login on either (getty_auto=0, getty units masked).
KernelCommandLine=console=tty0 console=ttyS0 systemd.gpt_auto=0 systemd.getty_auto=0 systemd.firstboot=off lockdown=integrity module.sig_enforce=1 systemd.allow_userspace_verity=0
KernelModules=default
              dm-verity
              vfat
              nls_cp437
              nls_iso8859-1
Packages=
        systemd
        udev
        kmod
        cryptsetup-bin
        # sd-stub for the UKI (mkosi takes it from the image)
        systemd-boot-efi
        linux-image-amd64
BuildPackages=
        gcc
        libc6-dev
RemovePackages=
        dpkg
        perl-base
# No system or configuration extensions in the recovery system either (an ESP .extra.d/ next to the recovery UKI
# would otherwise be merged into its initrd)
RemoveFiles=
        /usr/lib/systemd/system/systemd-sysext.service
        /usr/lib/systemd/system/systemd-confext.service
        /usr/lib/systemd/system/systemd-sysext.socket
        /usr/lib/systemd/system/systemd-sysext@.service
        /usr/lib/systemd/system/sockets.target.wants/systemd-sysext.socket
        /usr/lib/systemd/system/sysinit.target.wants/systemd-sysext.service
        /usr/lib/systemd/system/sysinit.target.wants/systemd-confext.service
        /usr/bin/systemd-sysext
        /usr/bin/systemd-confext
        # starts a shell (there is none)
        /usr/lib/systemd/system/debug-shell.service
        # its only rule (ibmveth on POWER) runs /bin/sh
        /usr/lib/udev/rules.d/73-special-net-names.rules
# As the slot initrd (images/debian/foilbird-initrd): the dpkg database as a data file for scanners (T13);
# no shell, no interpreter, no script, Debian's os-release made Foilbird's (the build fails otherwise). The recovery has no
# /etc/initrd-release on purpose: it is the whole system, systemd runs it as such from the initramfs (no switch-root).
PostInstallationScripts=../tools/dpkg-stash.postinst
FinalizeScripts=../tools/no-interpreters.finalize

[Validation]
SecureBoot=yes
SecureBootKey=../mkosi/mkosi.key
SecureBootCertificate=../mkosi/mkosi.crt
