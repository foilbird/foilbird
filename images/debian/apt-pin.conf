# SPDX-License-Identifier: Apache-2.0
# Third-party apt sets of the base image (tools/apt-pin.py; lock: apt-pin.lock next to this file; docs/reproducible-build.md).
# The trust anchor of each repository is pinned in tools/apt-pin.py (TRUSTED), never here.

# NVIDIA driver: open modules (source only, DKMS-built and signed by mkosi.build) + userspace, one version for the whole set.
# Official NVIDIA repository for Debian 13, driver branch 610+. Not validated on GPU hardware since the
# switch from 580.x/debian12: the GPU profile is experimental until a hardware run.
[nvidia-driver]
repo       = https://developer.download.nvidia.com/compute/cuda/repos/debian13/x86_64
version    = 610.57.04-1
closure    = nvidia-driver-cuda nvidia-kernel-support firmware-nvidia-gsp
source     = nvidia-kernel-open-dkms
source-dir = nvsrc
provenance = nvsrc/nvidia-inputs.json
