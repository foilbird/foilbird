# The slot UKI's initrd: built from images/debian/foilbird-initrd (Debian packages only, no shell, no
# interpreter) by its build.sh before this image; mkosi's default initrd (bash, dash, perl, mawk, scripts) is
# not built when Initrds= is set. mkosi appends the kernel modules initrd of this image (KernelInitrdModules=).
# Relative paths resolve against the config directory (see 50-agent.conf), also from a profile.
[Content]
Initrds=../foilbird-initrd/out/initrd.cpio.zst
