# UKI on the ESP of the disk image: the same name scheme as an update installs (90-uki.transfer,
# docs/boot-assessment.md), "installed, never booted" = <image-id>_<version>+3-0.efi. mkosi's default
# (<token>-<kver>-<roothash>.efi) is invisible to sysupdate (vacuum, InstancesMax) and to the agent's Rollback, so the
# first A/B from a disk could not be rolled back. The first boot is counted like any other, so it is blessed and
# committed (the bless unit no longer fails with "Not booted with boot counting").
# The split UKI on the update channel keeps its artifact name foilbird-deb_<version>.efi. The recovery UKI is a separate
# image (images/debian/recovery) and is not affected. %i is ImageId (foilbird-deb), so a derived image with its own
# ImageId keeps the scheme without a copy of this file.
[Content]
UnifiedKernelImageFormat=%i_%v+3-0
