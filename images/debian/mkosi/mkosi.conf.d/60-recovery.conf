# Recovery UKI (decision 0003), built separately by images/debian/recovery/build.sh into its out/ (not in git, except
# .keep). Copied onto the ESP next to the slot UKIs; sysupdate (foilbird-deb_@v...) and the Rollback unit never match
# its name. Into /efi, not /boot: mkosi takes the split UKI artifact (foilbird-deb_<v>.efi, the release on the update
# channel) from /boot/EFI/Linux, and with the recovery there it published the recovery UKI as the release (seen in a build).
# Relative paths resolve against the config directory (see 50-agent.conf).
[Content]
ExtraTrees=../recovery/out:/efi
