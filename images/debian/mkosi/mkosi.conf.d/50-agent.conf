# Node agent: binary and units staged by agent/stage-image-tree.sh into
# agent/out/ (not in git, except an empty .keep). Kept in its own drop-in so
# the base image config stays independent of the agent.
# Relative paths resolve against the config directory (images/debian/mkosi),
# also when this image is included from a profile; %D would be the directory
# mkosi runs in and breaks profiles (checked with mkosi summary).
[Content]
ExtraTrees=../../../agent/out:/
