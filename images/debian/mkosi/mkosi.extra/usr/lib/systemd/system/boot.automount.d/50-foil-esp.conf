# The ESP (boot.automount from systemd-gpt-auto-generator) is mounted only while used: unmounted after 60 s idle
# instead of 120 s, so the FAT is clean (dirty bit cleared) for most of the uptime and a power loss rarely finds it mounted.
# bless, sysupdate, Rollback and the agent just open /boot/...; docs/boot-assessment.md
[Automount]
TimeoutIdleSec=60
