# The generator's options (systemd 257: umask=0077,rw,nodev,nosuid,noexec,nosymfollow) plus "flush" (vfat writes
# back early instead of on unmount, so a power loss finds less unwritten metadata) and "noatime" (reading a UKI does not
# write the access date into its directory entry). Options= replaces the generated line, keep it in step with the
# generator: the build (mkosi.finalize) fails unless the image's systemd has the upstream version the generator's options
# were checked on (the line below, read on a VM from /run/systemd/generator/boot.mount) and those options are all in
# Options=. After a systemd update: check on a VM, then update the line.
# foil-generated-options: systemd=257.13 umask=0077,rw,nodev,nosuid,noexec,nosymfollow
# The fsck before the mount comes from the generator (fsck.vfat is in the image). docs/boot-assessment.md
[Mount]
Options=umask=0077,rw,nodev,nosuid,noexec,nosymfollow,flush,noatime
