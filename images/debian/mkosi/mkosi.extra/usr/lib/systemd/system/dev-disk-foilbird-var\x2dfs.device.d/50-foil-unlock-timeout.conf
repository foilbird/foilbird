# var.mount waits for /dev/disk/foilbird/var-fs from the start of the boot, with the default device timeout (30 s,
# systemd.default_device_timeout_sec). An encrypted /var appears only when foil-var-unlock has unsealed the TPM key,
# which retries on TPM_RC_PCR_CHANGED (up to 31 tries) and may take longer; seen under PCR extend load: unlock succeeded
# after 47 s, /var had already failed at 30 s. Wait at least as long as the unlock may run (TimeoutStartSec=90 there).
# Same mechanism as x-systemd.device-timeout= in fstab. docs/disk-encryption.md
[Unit]
JobRunningTimeoutSec=120
