# foil-var-unlock.service needs /dev/disk/by-partlabel/var. On a node's first boot the partition appears only when
# foil-repart.service has written the partition table, after formatting /var (systemd-repart writes the table last):
# minutes on a slow disk (an HDD with discard: about 150 s, Proxmox 2026-11-27). The default device wait of the image
# is 30 s from boot start (systemd.default_device_timeout_sec=30 in the kernel command line), so /var failed, the boot
# check failed and the boot was spent. Wait as long as foil-repart may run (TimeoutStartSec=300) plus a margin.
# On every later boot the partition is there from the start: this wait is never reached. docs/disk-encryption.md
[Unit]
JobRunningTimeoutSec=360
