# Bless only a boot that is counted. Upstream pulls this unit in only from systemd-bless-boot-generator,
# and only when systemd-boot set LoaderBootCountPath (the entry has a "+<left>-<done>" counter). foil-boot-committed
# pulls it in with Requires= on every boot; since re-arm was withdrawn a committed release boots as "<v>.efi" with no counter, and the
# unit then failed on every such boot (status=1, the system "degraded", foil-boot-committed "dependency failed").
# A skipped condition is not a failure for Requires=: on a committed boot both units are skipped (the commit marker is
# already there), on a counted boot bless runs and foil-boot-committed writes the marker after it. docs/boot-assessment.md
[Unit]
ConditionPathExists=/sys/firmware/efi/efivars/LoaderBootCountPath-4a67b082-0a4c-41cf-b6c7-440b29bb8c4f
