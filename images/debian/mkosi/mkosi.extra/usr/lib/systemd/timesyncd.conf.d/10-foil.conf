# The image ships no NTP servers: Debian's compiled-in fallback (debian.pool.ntp.org) is turned off. The node agent
# renders the servers from NodeConfig.time.servers into /run/systemd/timesyncd.conf.d/50-foil.conf (a later file name, so
# it adds to this one). Servers announced by DHCP (systemd-networkd) are still used.
[Time]
NTP=
FallbackNTP=
