# Persistent journal from the first boot. With the default Storage=auto journald keeps the journal in /run
# unless /var/log/journal exists when the flush runs; on the first boot /var is fresh and systemd-journal-flush.service ran
# before systemd-tmpfiles-setup created the directory, so the whole first boot was lost. persistent creates it itself.
[Journal]
Storage=persistent
