# nvidiafb/rivafb: legacy fbdev must never bind the GPU (seen loading on A100: "unknown NV_ARCH"); nouveau is already
# disabled by nvidia-graphics-drivers.conf (alias nouveau off).
# "blacklist" stops alias autoload; "install ... /bin/false" also refuses an explicit modprobe.
blacklist nvidiafb
install nvidiafb /bin/false
blacklist rivafb
install rivafb /bin/false
# nouveau: on Debian nothing else disables it (NVIDIA's /etc/modprobe.d/nvidia*.conf is moved to /usr by mkosi.finalize,
# but do not depend on it); seen loading on A100 ("unknown chipset 170000a1") before nvidia, 15.11.
blacklist nouveau
options nouveau modeset=0
install nouveau /bin/false
