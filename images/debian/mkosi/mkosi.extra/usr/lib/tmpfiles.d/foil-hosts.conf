# /etc/hosts is rendered by the node agent from NodeConfig.extra_host_entries into /run/foilbird/hosts (atomic rename, same
# name, so the link stays valid). The file below is created only if missing: localhost lines for a boot without the
# agent. /etc is tmpfs, so L+ just puts the link in place on every boot.
f /run/foilbird/hosts 0644 root root - 127.0.0.1 localhost\n::1 localhost ip6-localhost ip6-loopback\n
L+ /etc/hosts - - - - /run/foilbird/hosts
