# First boot: foil-repart.service (on the host, not the initrd) creates the empty B slot and /var from these
# definitions. They are outside /usr/lib/repart.d on purpose: the initrd systemd-repart would pick that up via
# /sysusr and enroll the encrypted /var with its own TPM defaults (no PCR 7). Existing partitions are matched by
# type in definition order and never relabeled; Weight=0 keeps them from growing. Sizes must match mkosi.repart/.
[Partition]
Type=esp
Weight=0
