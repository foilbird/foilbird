# Reserved state partition (ADR 0006, v1-alpha): created on first boot, fixed size, NOTHING reads, formats or mounts it.
# Future releases move the node's identity, configuration, anti-rollback floor and /var epochs here, so that /var can be
# wiped without re-registration. It has to exist from the first install: /var takes the rest of the disk and ext4 on
# LUKS2 does not shrink online, so a partition cannot be added on an installed node later. A later migration assigns the
# final type, label, encryption and file system (GPT entries only, no data moves).
# Placed before 30-var.conf so that it sits between slot B and /var. No Format=, no Encrypt=: nothing to unlock at boot.
# Size: docs/updates.md (partition layout). Required on a fresh installation: no room for it fails foil-repart and the
# installation. Nodes installed before this file get no state partition (no migration): foil-repart.service runs only
# while there is no /var partition, so it never meets their full disk.
[Partition]
Type=linux-generic
Label=_reserved-state
SizeMinBytes=256M
SizeMaxBytes=256M
