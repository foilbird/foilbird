# /var: LUKS2, enrolled at creation to the TPM only: PCR 7 (Secure Boot state) literal + PCR 11 policy signed by the
# image's PCR key (/usr/lib/foilbird/pcr-key.pem, see foil-repart.service). No passphrase or recovery key slot.
# Rest of the disk. Opened by foil-var-unlock.service.
[Partition]
Type=var
Label=var
Format=ext4
Encrypt=tpm2
SizeMinBytes=1G
