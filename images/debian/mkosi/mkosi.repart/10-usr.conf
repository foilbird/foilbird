# Fixed size (not Minimize=): systemd-sysupdate writes every later release into an existing slot of this size.
# Keep headroom for /usr growth between releases: 2560M = 45 % free for k8s-worker + NVIDIA (16.11.2026,
# docs/updates.md). The same size in usr/lib/foilbird/repart.d/20-usr-b.conf (slot B, created on first boot).
[Partition]
Type=usr
Label=usr_%A
Format=erofs
CopyFiles=/usr:/
Verity=data
VerityMatchKey=usr
SizeMinBytes=2560M
SizeMaxBytes=2560M
