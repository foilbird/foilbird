# NVIDIA's sample unit has no ordering against the driver: it started before nvidia.ko and /dev/nvidia* existed (A100, 15.11).
[Unit]
After=systemd-udev-trigger.service systemd-modules-load.service
[Service]
# Skip (not fail) on machines without an NVIDIA GPU, e.g. the QEMU test VMs: nvidia.ko refuses to load without a device, and an
# ExecCondition exit code 1-254 skips the unit. modprobe is safe to run while udev loads the same module (it returns 0 once the
# module is in), unlike nvidia-modprobe, which udev (60-nvidia.rules), this unit and foil-nvidia-cdi used to run at the same moment:
# the one that lost the race skipped its unit (seen on the A100: persistenced on one boot, the CDI spec on the next).
# A condition on /proc/driver/nvidia/gpus would be checked before the module is guaranteed to be loaded.
# With a GPU the device nodes are created in ExecStartPre=, so a failure fails the unit. No shell (profiles may have none).
ExecCondition=/usr/sbin/modprobe -q nvidia
# Wait for the udev queue (60-nvidia.rules runs nvidia-modprobe on module load) so the two do not overlap.
ExecStartPre=/usr/bin/udevadm settle --timeout=120
ExecStartPre=/usr/bin/nvidia-modprobe -c 0 -u
