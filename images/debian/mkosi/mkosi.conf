# The node image on Debian 13 trixie.
# UKI under our Secure Boot keys, /usr erofs on signed dm-verity, lockdown + sig_enforce, root=tmpfs.
# NVIDIA (only in an image with the NVIDIA userspace, variant gpu): open modules built by DKMS in the build overlay
# (mkosi.build), signed with our db key; only .ko go to the image.
[Include]
# Debian snapshot, tools tree, mkosi version (docs/reproducible-build.md)
Include=../reproducible.conf

[Distribution]
Distribution=debian
Release=trixie
# mkosi adds trixie-updates and trixie-security itself
Repositories=main,contrib,non-free,non-free-firmware

[Output]
Format=disk
ImageId=foilbird-deb
# The release number; every build of a release passes --image-version=<N>. Partition labels and UKI names carry it.
ImageVersion=0.0.1
RepartDirectories=mkosi.repart
# A/B payload for systemd-sysupdate: /usr, its verity hash and signature, and the UKI as separate files
SplitArtifacts=uki,partitions
# package list with versions (mkosi manifest), input of the build manifest
ManifestFormat=json

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
# restart-on-corruption: a corrupted /usr block reboots the node; with boot counting a bad slot is abandoned (docs/updates.md)
# default_device_timeout_sec=30: a slot whose /usr never appears fails (and reboots) after 30 s instead of 90 s
# allow_userspace_verity=0: dm-verity signatures are checked only by the kernel keyring, never against certificates in
# /etc/verity.d or /run/verity.d (docs/image-policy.md)
# console=tty0 console=ttyS0: kernel and systemd messages on the screen too; the LAST console= is the
# primary one (/dev/console), so the serial console stays primary. No login on either (getty_auto=0, getty units masked).
KernelCommandLine=console=tty0 console=ttyS0 root=tmpfs systemd.firstboot=off lockdown=integrity module.sig_enforce=1 systemd.verity_usr_options=restart-on-corruption systemd.default_device_timeout_sec=30 systemd.allow_userspace_verity=0
# no automatic root login on any console: the profile repeated Autologin=no, the base image must not
# depend on that; no lab build needs a console login (lab checks go through the agent API and the serial log)
Autologin=no
RemovePackages=
        dpkg
        perl-base
RemoveFiles=
        /usr/lib/systemd/system/nvidia-suspend.service
        /usr/lib/systemd/system/nvidia-hibernate.service
        /usr/lib/systemd/system/nvidia-resume.service
        /usr/lib/systemd/system/nvidia-suspend-then-hibernate.service
        /usr/lib/systemd/system-sleep/nvidia
        /usr/sbin/dpkg-preconfigure
        /usr/sbin/dpkg-reconfigure
        /usr/share/man/man8/dpkg-preconfigure.8.gz
        /usr/share/man/man8/dpkg-reconfigure.8.gz
        # updates are started by the node agent on request, never by timer; reboot only after drain (docs/updates.md)
        /usr/lib/systemd/system/systemd-sysupdate.timer
        /usr/lib/systemd/system/systemd-sysupdate-reboot.timer
        /usr/lib/systemd/system/systemd-sysupdate-reboot.service
        # No system or configuration extensions - /usr and /etc are only what the signed image ships. The initrd has
        # none (images/debian/foilbird-initrd, docs/image-policy.md)
        /usr/lib/systemd/system/systemd-sysext.service
        /usr/lib/systemd/system/systemd-confext.service
        /usr/lib/systemd/system/systemd-sysext.socket
        /usr/lib/systemd/system/systemd-sysext@.service
        /usr/lib/systemd/system/sockets.target.wants/systemd-sysext.socket
        /usr/bin/systemd-sysext
        /usr/bin/systemd-confext
        # Of dosfstools only fsck.fat (+ the fsck.vfat name that fsck and systemd-fsck look up) for the ESP check at mount
        /usr/sbin/fatlabel
        /usr/sbin/dosfslabel
        /usr/sbin/mkfs.fat
        /usr/sbin/mkfs.vfat
        /usr/sbin/mkfs.msdos
        /usr/sbin/mkdosfs
        /usr/sbin/dosfsck
        /usr/sbin/fsck.msdos
        # No ESP write on a healthy boot. bootctl random-seed (this unit, static in systemd) creates
        # \loader\random-seed on the ESP, and once it exists systemd-boot rewrites it from the firmware on every boot
        # (src/boot/random-seed.c, v257); mkosi leaves no seed file in the image. The kernel gets entropy from the EFI RNG,
        # RDRAND and the TPM (docs/boot-assessment.md, decision 0003)
        /usr/lib/systemd/system/systemd-boot-random-seed.service
        /usr/lib/systemd/system/sysinit.target.wants/systemd-boot-random-seed.service
# + small VM and BMC display drivers: mkosi ships the image's FULL modules.dep/modules.alias in the initrd with only the
# default subset of .ko files, so udev in the initrd resolves e.g. QEMU's std VGA to bochs and kmod fails on its missing
# dependency drm_vram_helper.ko (error on every boot). Dependencies of these are added by mkosi.
KernelInitrdModules=default
                    /drivers/gpu/drm/tiny/*
                    /drivers/gpu/drm/virtio/*
                    /drivers/gpu/drm/ast/*
                    /drivers/gpu/drm/mgag200/*
Packages=
        systemd
        systemd-container
        systemd-cryptsetup
        systemd-boot
        systemd-boot-efi
        udev
        dbus
        kmod
        gpg
        # time for mTLS and Kubernetes (reported by the agent, not a boot gate)
        systemd-timesyncd
        # first boot repartitioning on the host (foil-repart.service); the initrd runs no repart
        systemd-repart
        # cryptsetup CLI: foil-var-unlock tries the TPM2 tokens one by one (docs/disk-encryption.md)
        cryptsetup-bin
        # device-mapper udev rules: without them libcryptsetup waits forever for udev while repart formats /var
        dmsetup
        # mkfs.ext4 for /var, created by systemd-repart on first boot
        e2fsprogs
        # fsck.fat for the ESP. A power loss while the ESP is mounted leaves the FAT dirty, and the kernel sets it
        # read-only on the next write (bless, sysupdate, Rollback then fail). With fsck.vfat present systemd-gpt-auto-generator
        # orders systemd-fsck@ before boot.mount, as upstream (docs/boot-assessment.md)
        dosfstools
        libtss2-tcti-device0t64
        libtss2-esys-3.0.2-0t64
        libtss2-rc0t64
        linux-image-amd64
# Build overlay only (never in the image): kernel headers of the same kernel, DKMS, the NVIDIA open module source
BuildPackages=
        linux-headers-amd64
        dkms
        build-essential
        openssl
        xz-utils
# NVIDIA userspace comes from a generated variant file (pinned.conf, tools/apt-pin.py prepare: one pinned version for the
# whole set, installed from the verified local copy file:/srv/apt-pin/nvidia-driver/ of the aptpin sandbox tree). The
# open-module source is NOT a build package: its postinst runs a DKMS build that dkms cannot sign in a chroot and that
# aborts the whole install on a compile error. apt-pin.py puts the verified .deb into nvsrc/, mkosi.build unpacks and
# DKMS-builds it when the image has the NVIDIA userspace (without it the source stays unused in the build tree).

[Validation]
# The PCR 11 policy in the UKI (.pcrsig) is signed by a PCR key separate from db, passed by the build:
# --sign-expected-pcr-key=… --sign-expected-pcr-certificate=… (without them mkosi signs with SecureBootKey).
SignExpectedPcr=yes
SecureBoot=yes
SecureBootAutoEnroll=yes
SecureBootKey=mkosi.key
SecureBootCertificate=mkosi.crt
VerityKey=mkosi.key
VerityCertificate=mkosi.crt

[Runtime]
TPM=yes
RAM=2G
